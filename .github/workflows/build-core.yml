name: Build patched Mihomo core

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: android, arch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build core
        shell: pwsh
        run: ./core/build.ps1 -TargetOS '${{ matrix.os }}' -TargetArch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-lite-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/mihomo-lite-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error
